<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Devine's Ethereal Lyricist</title>

  <meta name="description"
    content="Explore original poetry and lyrical creations by Devine Phoebe. A creative platform for music, emotion, and storytelling." />

  <meta name="author" content="Devine Phoebe">

  <link rel="icon" href="images/favicon.png">

  <link rel="stylesheet" href="styles/final.css">
  <link rel="stylesheet" href="styles/final-large.css">

  <script defer src="scripts/main.js"></script>
</head>

<body>

  <header>
    <nav class="navbar">
      <h2 class="logo">Ethereal</h2>

      <button id="menuBtn">&#9776;</button>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="lyrics.html">Music & Poems</a></li>
        <li><a href="about.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section>
      <h1>Contact Me</h1>

      <form action="thankyou.html" method="get">

        <label>
          Full Name
          <input type="text" name="name" required>
        </label>

        <label>
          Email
          <input type="email" name="email" required>
        </label>

        <label>
          Favorite Genre
          <select name="genre">
            <option>Poetry</option>
            <option>Music</option>
            <option>Both</option>
          </select>
        </label>

        <label>
          Message
          <textarea name="message" rows="5"></textarea>
        </label>

        <input type="submit" value="Send Message">

      </form>
    </section>

  </main>

  <footer>
    <p>© 2026 Devine Phoebe</p>
    <a href="attributions.html">Attributions</a>
    <a href="https://youtu.be/zAEVCkPQQ68" target="_blank">Project Video</a>
  </footer>

</body>

</html>
